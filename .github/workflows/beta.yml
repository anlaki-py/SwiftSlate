name: Beta Build

on:
  push:
    branches: [ test ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Compute version
        id: version
        run: |
          echo "versionCode=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "versionName=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint -PversionCode=1 -PversionName=ci

      - name: Run unit tests
        run: ./gradlew test -PversionCode=1 -PversionName=ci

      - name: Build beta APK
        run: >
          ./gradlew assembleBeta
          -PversionCode=${{ steps.version.outputs.versionCode }}
          -PversionName=${{ steps.version.outputs.versionName }}
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: beta-apk
          path: app/build/outputs/apk/beta/*.apk
